name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx napi build --manifest-path crates/quill-node/Cargo.toml -o crates/quill-node --dts index.d.ts
      - name: Smoke-test quill-node addon
        shell: bash
        run: |
          SMOKE_DIR=$(node -e 'const fs=require("fs"),os=require("os"),path=require("path"); process.stdout.write(fs.mkdtempSync(path.join(os.tmpdir(), "quill-ci-")));')
          export SMOKE_DIR
          node -e '
          const path = require("path");
          const { QuillCore, resolveDefaultLogDir } = require("./crates/quill-node/index.node");
          const tmp = process.env.SMOKE_DIR;
          (async () => {
            const core = await QuillCore.boot({
              appDataBaseDir: path.join(tmp, "appdata"),
              logDir: path.join(tmp, "logs"),
              isDev: true,
              mcpBinaryPath: path.join(tmp, "quill-mcp")
            }, () => {});
            await core.dispatch("set_setting", JSON.stringify({ key: "theme", value: "dark" }));
            const theme = JSON.parse(await core.dispatch("get_setting", JSON.stringify({ key: "theme" })));
            const roots = await core.allowedMediaRoots();
            if (theme !== "dark" || !Array.isArray(roots) || roots.length === 0 || !resolveDefaultLogDir(true)) {
              process.exit(1);
            }
          })();
          '
          # Clean up after the addon process exits and releases SQLite/WAL handles (required on Windows).
          node -e 'require("fs").rmSync(process.env.SMOKE_DIR, { recursive: true, force: true });'
      - run: npx tsc --noEmit
      - run: npx tsc -p tsconfig.electron.json --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run electron:build
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Validate unpacked Electron bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          QUILL_PACK_ALLOW_DEBUG: "1"
        run: |
          cargo build -p quill-mcp
          arch=$(node -e 'process.stdout.write(process.arch === "arm64" ? "arm64" : "x64")')
          mac_dir=$([[ "$arch" == "arm64" ]] && echo "mac-arm64" || echo "mac")
          npx electron-builder --mac --dir --"$arch" --publish never
          node scripts/validate-pack.mjs --platform darwin --arch "$arch"
          test ! -e "dist-electron/$mac_dir/Quill.app/Contents/Resources/app.asar.unpacked"
      - name: Validate unpacked Electron bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          QUILL_PACK_ALLOW_DEBUG: "1"
        run: |
          cargo build -p quill-mcp
          npx electron-builder --win --x64 --dir --publish never
          node scripts/validate-pack.mjs --platform win32 --arch x64
          test ! -e dist-electron/win-unpacked/resources/app.asar.unpacked
